<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="MC3 Web, a study: an Xbox racing game recompiled to WebAssembly, with online free-roam">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.55" stop-color="#1a0b22"/>
      <stop offset="1" stop-color="#2b0f12"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e4d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9d1c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#sky)"/>
  <!-- skyline -->
  <g fill="#0d0a14">
    <rect x="0" y="200" width="70" height="160"/><rect x="62" y="150" width="54" height="210"/>
    <rect x="110" y="185" width="80" height="175"/><rect x="185" y="120" width="46" height="240"/>
    <rect x="226" y="170" width="90" height="190"/><rect x="900" y="160" width="60" height="200"/>
    <rect x="955" y="110" width="48" height="250"/><rect x="998" y="180" width="86" height="180"/>
    <rect x="1078" y="140" width="56" height="220"/><rect x="1128" y="190" width="72" height="170"/>
  </g>
  <g fill="#ffcf7a" opacity="0.55">
    <rect x="72" y="166" width="5" height="5"/><rect x="88" y="190" width="5" height="5"/><rect x="196" y="140" width="4" height="4"/>
    <rect x="210" y="170" width="4" height="4"/><rect x="245" y="196" width="5" height="5"/><rect x="964" y="132" width="4" height="4"/>
    <rect x="980" y="166" width="4" height="4"/><rect x="1090" y="160" width="5" height="5"/><rect x="1146" y="210" width="5" height="5"/>
  </g>
  <!-- road light streaks -->
  <path d="M600 360 L380 230 L392 230 L612 360 Z" fill="url(#road)" opacity="0.6"/>
  <path d="M600 360 L820 230 L808 230 L588 360 Z" fill="url(#road)" opacity="0.6"/>
  <path d="M0 300 C300 270 900 270 1200 300" stroke="#58e0ff" stroke-width="2" fill="none" opacity="0.45" filter="url(#glow)"/>
  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="92" font-style="italic" letter-spacing="4" fill="url(#title)" filter="url(#glow)">MC3 WEB</text>
  <text x="600" y="198" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" letter-spacing="8" fill="#ececec">A STUDY · XBOX → WEBASSEMBLY · ONLINE FREE-ROAM</text>
  <text x="600" y="240" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#9aa3b0">fan research project · no game data included · bring your own disc</text>
</svg>
